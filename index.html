<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Samples.Html</title>
    <link rel="stylesheet" href="./src/main/css/main.css">
    <meta name="version" content="0.0.1">
</head>
<body>
<div class="FlexBox" style="width: 100%; height: 100%;">
    <div class="FlexBox" style="width: 256px; height: 100%; flex-direction: column;">
        <div class="Box" style="width: 100%; height: 64px;"></div>
        <div style="width: 100%; padding: 0 8px; box-sizing: border-box;">
            <div style="width: 100%; height: 1px; background-color: var(--colors-border);"></div>
        </div>
        <div id="StartItems" class="FlexBox StartItems" style="width: 100%; flex: 1;">
            <div data-id="foo" class="Box StartItem" style="width: 100%;">foo</div>
            <div data-id="bar" class="Box StartItem" style="width: 100%;">bar</div>
            <div data-id="baz" class="Box StartItem" style="width: 100%;">baz</div>
        </div>
        <div class="Box" style="width: 100%;"></div>
    </div>
    <div style="height: 100%; padding: 8px 0; box-sizing: border-box;">
        <div style="width: 1px; height: 100%; background-color: var(--colors-border);"></div>
    </div>
    <div class="FlexBox" style="height: 100%; flex: 1; flex-direction: column;">
        <div class="FlexBox" style="width: 100%; height: 64px; padding: 0 16px; align-items: center;">
            <div class="Box" style="height: 100%;"></div>
            <div class="Box" style="height: 100%; flex: 1;"></div>
            <div id="ColorsSwitch" class="Box Colors" style="">colors</div>
            <div class="Box" style="height: 100%;"></div>
        </div>
        <div style="width: 100%; padding: 0 8px; box-sizing: border-box;">
            <div style="width: 100%; height: 1px; background-color: var(--colors-border);"></div>
        </div>
        <div id="MainScreen" class="Box" style="width: 100%; padding: 0 16px; flex: 1; min-height: 0; overflow-y: auto;"></div>
    </div>
</div>
<script src="./src/main/js/main.js"></script>
</body>
</html>
